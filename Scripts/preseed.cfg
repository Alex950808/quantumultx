# =============================================================================
# 🔴 低内存自动跳过 (必须放在最顶部，否则安装器会卡在 Low memory 确认界面)
# =============================================================================
# 设置安装器优先级为 critical，跳过所有非致命交互提问
d-i debconf/priority string critical
# 启用全自动安装模式
d-i auto-install/enable boolean true
# 显式声明接受低内存模式，不弹窗询问
d-i lowmem/low boolean true
d-i lowmem/default boolean true
# 低内存模式下自动选择默认模块集，不询问
d-i anna/choose_modules_lowmem multiselect

### 本地化
# 设置安装器界面及系统默认语言环境为美式英语 UTF-8 编码
d-i debian-installer/locale string en_US.UTF-8
# 设置键盘布局为美式英语（US）
d-i keyboard-configuration/xkb-keymap select us

### 网络配置
# 自动选择可用的网络接口进行配置
d-i netcfg/choose_interface select auto
# 设置系统主机名
d-i netcfg/get_hostname string debian-host
# 设置系统域名后缀
d-i netcfg/get_domain string localdomain

### 时区
# 设置系统时区为亚洲/上海（东八区）
d-i time/zone string Asia/Shanghai
# 将硬件时钟设置为 UTC 时间
d-i clock-setup/utc boolean true
# 安装过程中启用 NTP 自动同步时间
d-i clock-setup/ntp boolean true
# 指定 NTP 时间同步服务器为阿里云 NTP
d-i clock-setup/ntp-server string ntp.aliyun.com

### 镜像源
# 指定软件源协议为 HTTP
d-i mirror/protocol string http
# 手动指定镜像源国家（不通过地理位置自动选择）
d-i mirror/country string manual
# 指定 APT 软件源的主机名（国内建议替换为 mirrors.tuna.tsinghua.edu.cn）
d-i mirror/http/hostname string deb.debian.org
# 指定软件源的目录路径
d-i mirror/http/directory string /debian
# 设置 HTTP 代理为空
d-i mirror/http/proxy string
# 允许安装 non-free 专有软件包（如闭源驱动、固件）
d-i apt-setup/non-free boolean true
# 允许安装 contrib 社区贡献软件包
d-i apt-setup/contrib boolean true

### 分区：动态探测磁盘 + 整盘单分区（无 Swap）
# ✅ 核心：在安装器加载 partman 前，自动将第一块物理磁盘写入 debconf
# list-devices disk 会按内核枚举顺序列出所有块设备，head -1 取首块
# 该变量会被后续 partman-auto/disk 读取，实现真正的零干预适配
d-i partman/early_command string \
    DEVICE=$(list-devices disk | head -n 1); \
    debconf-set partman-auto/disk "$DEVICE"

# 使用常规分区方式（不使用 LVM 或加密）
d-i partman-auto/method string regular
# ⚠️ 此处留空，实际值由上方 early_command 动态注入
d-i partman-auto/disk string ""
# 🔴 使用自定义配方代替 atomic，彻底移除 Swap（atomic 强制包含 swap）
d-i partman-auto/choose_recipe select noswap-root
# 🔴 定义自定义分区配方：仅一个根分区，占用全部空间，无 swap
# 1000 50 -1 表示：最小1GB / 优先50MB / 最大无上限（占满剩余空间）
d-i partman-auto/expert_recipe string \
      noswap-root :: \
          1000 50 -1 ext4 \
              $primary{ } $bootable{ } \
              method{ format } format{ } \
              use_filesystem{ } filesystem{ ext4 } \
              mountpoint{ / } \
          .

# 强制禁止创建 Swap 分区 (针对低内存环境优化)
d-i partman-basicfilesystems/no_swap boolean true
d-i partman-base/no_swap boolean true

# 自动确认写入新分区表标签，无需人工干预
d-i partman-partitioning/confirm_write_new_label boolean true
# 自动完成分区选择
d-i partman/choose_partition select finish
# 自动确认分区操作，无需人工干预
d-i partman/confirm boolean true
# 确认覆盖磁盘上已有的分区表和数据
d-i partman/confirm_nooverwrite boolean true
# 自动移除磁盘上已存在的 LVM 卷组
d-i partman-lvm/device_remove_lvm boolean true
# 自动移除磁盘上已存在的 RAID 阵列
d-i partman-md/device_remove_md boolean true

### 用户与密码（仅 root）
# ✅ 允许 root 账户直接登录（控制台 + SSH）
d-i passwd/root-login boolean true
# 设置 root 明文密码（⚠️ 生产环境务必改用 passwd/root-password-crypted）
d-i passwd/root-password password admin@123
# 再次确认 root 密码
d-i passwd/root-password-again password admin@123
# ❌ 跳过普通用户创建（设为 false 后安装器不会提示创建普通用户）
d-i passwd/make-user boolean false

### 软件包选择
# 预装标准系统工具集和 OpenSSH 服务端
tasksel tasksel/first multiselect standard, ssh-server
# 额外安装指定的常用软件包
d-i pkgsel/include string openssh-server vim curl wget net-tools
# 安装完成后执行安全升级（仅修复安全漏洞）
d-i pkgsel/upgrade select safe-upgrade
# 不启用自动更新策略（由管理员手动管理更新）
d-i pkgsel/update-policy select none

### GRUB 引导
# 仅在检测到只有 Debian 系统时安装 GRUB 到 MBR/EFI
d-i grub-installer/only_debian boolean true
# 将 GRUB 安装到默认启动设备
d-i grub-installer/bootdev string default

### 安装完成
# 安装结束重启时跳过“请取出安装介质”提示，直接自动重启
d-i finish-install/reboot_in_progress note

### 🔧 Post-install 脚本：开启 root SSH 密码登录
# Debian 12+ 默认禁止 root 密码 SSH 登录，此处自动修改 sshd_config 并重启服务
d-i preseed/late_command string \
    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /target/etc/ssh/sshd_config; \
    in-target systemctl restart ssh
